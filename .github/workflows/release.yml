name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Get version from tag
      id: get-version
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
        echo "Tag version: $TAG_VERSION"
        echo "File version: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "ERROR: Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
          exit 1
        fi
        echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

    - name: Require a ChangeLog section for this version
      run: |
        # v1.7.4 shipped with no ChangeLog section and the gap went unnoticed
        # for four months. Gate the release on the section existing, so the
        # "Unreleased" heading has to be renamed before a tag can ship.
        if ! grep -qx "Version ${{ steps.get-version.outputs.version }}" ChangeLog; then
          echo "ERROR: ChangeLog has no 'Version ${{ steps.get-version.outputs.version }}' section."
          echo "Rename the 'Unreleased' heading to 'Version ${{ steps.get-version.outputs.version }}' and re-tag."
          exit 1
        fi
        echo "Found ChangeLog section for ${{ steps.get-version.outputs.version }}"

  build-linux:
    name: Linux
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libnetcdf-dev libhdf5-dev netcdf-bin

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Create binary package
      run: |
        cd build
        cpack -G TGZ

    - name: Create source packages
      run: |
        cd build
        cpack --config CPackSourceConfig.cmake

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-packages
        path: |
          build/dbd2netcdf-*-Linux*.tar.gz
          build/dbd2netcdf-*-Source.tar.gz
          build/dbd2netcdf-*-Source.zip

  build-macos:
    name: macOS
    needs: validate-version
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        for pkg in cmake netcdf hdf5; do
          brew list $pkg &>/dev/null || brew install $pkg
        done

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Create binary package
      run: |
        cd build
        cpack -G TGZ

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-packages
        path: build/dbd2netcdf-*-Darwin*.tar.gz

  build-windows:
    name: Windows (MSVC)
    needs: validate-version
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup MSVC
      # TheMrMilchmann/setup-msvc-dev is a drop-in replacement for
      # ilammy/msvc-dev-cmd@v1, which still targets Node 20 and triggers a
      # deprecation warning on every Windows run. This action runs on Node 24.
      uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
      with:
        arch: x64

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        python-version: '3.11'
        channels: conda-forge
        channel-priority: strict
        activate-environment: dbd2netcdf
        conda-remove-defaults: true

    - name: Install dependencies via conda
      run: |
        conda install -y libnetcdf hdf5 zlib cmake ninja

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_PREFIX_PATH="$env:CONDA_PREFIX\Library"

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: |
        Set-Location build
        ctest -C Release --output-on-failure

    - name: Create binary package
      run: |
        Set-Location build
        cpack -G ZIP

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-packages
        path: build/dbd2netcdf-*-win64*.zip

  create-release:
    name: Create Release
    needs: [validate-version, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List release artifacts
      run: ls -lhR artifacts/

    - name: Build release notes from the ChangeLog
      env:
        VERSION: ${{ needs.validate-version.outputs.version }}
      run: |
        # Extract this version's ChangeLog section: everything between its
        # heading and the next "Version " heading, with surrounding blank
        # lines trimmed. validate-version already proved the heading exists.
        awk -v ver="Version $VERSION" '
          $0 == ver             { inside = 1; next }
          inside && /^Version / { exit }
          inside && NF          { started = 1 }
          inside && started     { lines[++n] = $0; if (NF) last = n }
          END                   { for (i = 1; i <= last; i++) print lines[i] }
        ' ChangeLog > changes.txt

        if [ ! -s changes.txt ]; then
          echo "ERROR: ChangeLog section for $VERSION is empty"
          exit 1
        fi

        # The whole body is built here rather than split between body_path and
        # body: action-gh-release prefers body_path when both are set, and its
        # append_body option appends to an existing release, not to body.
        {
          echo "## dbd2netcdf v$VERSION"
          echo
          echo "### Changes"
          echo
          echo '```'
          cat changes.txt
          echo '```'
          echo
          echo "### Downloads"
          echo
          echo "| Platform | File |"
          echo "|----------|------|"
          echo "| Linux x86_64 | \`dbd2netcdf-$VERSION-Linux-x86_64.tar.gz\` |"
          echo "| macOS ARM (Apple Silicon) | \`dbd2netcdf-$VERSION-Darwin-arm64.tar.gz\` |"
          echo "| Windows x64 | \`dbd2netcdf-$VERSION-win64.zip\` |"
          echo "| Source (tar.gz) | \`dbd2netcdf-$VERSION-Source.tar.gz\` |"
          echo "| Source (zip) | \`dbd2netcdf-$VERSION-Source.zip\` |"
          echo
          echo "> **Note:** Linux and macOS binaries require system-installed NetCDF and HDF5 libraries."
          echo "> Install via \`apt-get install libnetcdf-dev\` (Debian/Ubuntu) or \`brew install netcdf\` (macOS)."
          echo
          echo "### Installation"
          echo
          echo "See [README.md](https://github.com/mousebrains/dbd2netcdf#readme) for build instructions."
        } > notes.md

        echo "--- release notes ---"
        cat notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3.0.2
      with:
        name: v${{ needs.validate-version.outputs.version }}
        body_path: notes.md
        files: artifacts/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
